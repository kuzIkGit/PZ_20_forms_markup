<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Регистрация</title>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <main class="page">
      <h1>Регистрация на прогулку</h1>
      <form class="form" action="#" method="post">
<fieldset>
  <legend>Контактные данные</legend>
  <div class="form__field">
    <label for="name">Имя</label>
    <input id="name" name="name" type="text" placeholder="Введите имя" required />
  </div>
  <div class="form__field">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" placeholder="name@example.com" required />
  </div>
</fieldset>

<fieldset>
  <legend>Выберите время</legend>
  <label><input type="radio" name="time" value="10" /> 10:00</label>
  <label><input type="radio" name="time" value="18" /> 18:00</label>
</fieldset>

<label for="route">Маршрут</label>
<select id="route" name="route">
  <option value="center">Центр</option>
  <option value="north">Север</option>
</select>

<label for="comment">Комментарий</label>
<textarea id="comment" name="comment"></textarea>

<label><input type="checkbox" name="agreement" required /> Я согласен</label>

<button type="submit">Записаться</button>
      </form>
    </main>
  </body>
</html>
